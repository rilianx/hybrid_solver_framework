name: generar con LLM

# Solo manual: cada corrida gasta llamadas de API, así que nunca se dispara
# por push ni por schedule.
on:
  workflow_dispatch:
    inputs:
      problem:
        description: "Problema"
        default: flowshop
        type: choice
        options: [flowshop, flowshop_cmax, clsp, jobshop, cvrp]
      target:
        description: "Qué generar: model (el modelo C++ del problema), model_optimize (una versión más rápida del modelo aceptado), components (componentes C++ sobre el modelo; slots por defecto constructor neighborhood perturbation), optimize (versiones más rápidas de los componentes aceptados; slots de opt_slots) o mip (la vista MIP en Python para el sub-MIP de HYB)"
        default: components
        type: choice
        options: [model, model_optimize, components, optimize, mip]
      slots:
        description: "Con target=components: slots a generar, separados por espacio (constructor, neighborhood, perturbation, relink, destruction)"
        default: "constructor neighborhood perturbation"
        type: string
      n:
        description: "Variantes por slot"
        default: "3"
        type: string
      rounds:
        description: "Rondas máximas (1 generación + correcciones)"
        default: "3"
        type: string
      provider:
        description: "Proveedor del LLM"
        default: openai
        type: choice
        options: [openai, anthropic]
      model:
        description: "Modelo (vacío = default del proveedor: gpt-5.4-mini en openai, claude-opus-5-5 en anthropic)"
        default: ""
        type: string
      effort:
        description: "Con provider=anthropic: profundidad del pensamiento (low | medium | high | xhigh | max; vacío = high)"
        default: ""
        type: string
      price_in:
        description: "USD por millón de tokens de ENTRADA (vacío = no estimar costo)"
        default: ""
        type: string
      price_out:
        description: "USD por millón de tokens de SALIDA"
        default: ""
        type: string
      fresh:
        description: "Con target=model o components: borrar lo generado antes (model borra el workspace; components, solo los componentes)"
        default: false
        type: boolean
      open_pr:
        description: "Abrir un PR con lo generado"
        default: true
        type: boolean
      opt_new_only:
        description: "Con target=optimize: solo los componentes C++ que nunca se optimizaron"
        default: false
        type: boolean
      opt_min_speedup:
        description: "Con target=optimize o model_optimize: mejora de velocidad exigida en la primera pasada (las siguientes, 1.1)"
        default: "1.2"
        type: string
      opt_slots:
        description: "Con target=optimize: slots cuyos componentes se aceleran"
        default: "neighborhood"
        type: string
      hint:
        description: "Con target=components: indicación del investigador que se agrega al pedido al LLM"
        default: ""
        type: string
      bench_size:
        description: "Tamaño donde se mide la velocidad de los componentes (vacío = bench_size del problema), p.ej. 500x20"
        default: ""
        type: string
      workspace:
        description: "Workspace (vacío = generated/<problema>_native); úsalo para no pisar una corrida anterior"
        default: ""
        type: string
      compact_prompts:
        description: "Prompts compactos: prototipos (firmas y comentarios) en lugar del código completo del modelo, de los componentes del catálogo y de la instancia (llm/outline.py); desmarcar para los completos"
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WS: ${{ inputs.workspace || format('generated/{0}_native', inputs.problem) }}
      TARGET: ${{ inputs.target }}
      HINT: ${{ inputs.hint }}
      HSF_BENCH_SIZE: ${{ inputs.bench_size }}
      HSF_COMPACT_PROMPTS: ${{ inputs.compact_prompts && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Localizar la raíz del framework
        run: |
          # el framework puede estar en la raíz del repo o en una subcarpeta
          HIT="$(find . -path ./.git -prune -o -path '*/core/skeleton.py' -print | head -1)"
          if [ -z "$HIT" ]; then echo "::error::No encontré core/skeleton.py en el repo."; exit 1; fi
          ROOT="$(dirname "$(dirname "$HIT")")"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Raíz del framework: $ROOT"

      - name: Instalar dependencias
        working-directory: ${{ env.ROOT }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar que la clave está configurada
        env:
          PROVIDER: ${{ inputs.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}
        working-directory: ${{ env.ROOT }}
        run: |
          if [ "$PROVIDER" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Falta el secreto OPENAI_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "$PROVIDER" = "anthropic" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Limpiar corrida anterior
        if: ${{ inputs.fresh }}
        working-directory: ${{ env.ROOT }}
        run: |
          # components conserva el modelo C++ del workspace; optimize y model_optimize trabajan sobre lo aceptado
          if [ "$TARGET" = "model" ]; then
            rm -rf "$WS"
          elif [ "$TARGET" = "components" ] && [ -d "$WS" ]; then
            find "$WS" -mindepth 1 -maxdepth 1 ! -name model ! -name 'model_*stats.json' ! -name mip ! -name mip_stats.json -exec rm -rf {} +
          else
            echo "$TARGET trabaja sobre lo aceptado en el workspace: no se limpia"
          fi

      - name: Generar y validar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}
          SLOTS: ${{ inputs.slots }}
          OPT_SLOTS: ${{ inputs.opt_slots }}
          OPT_MIN_SPEEDUP: ${{ inputs.opt_min_speedup }}
          OPT_NEW_ONLY: ${{ inputs.opt_new_only && 'true' || 'false' }}
          N: ${{ inputs.n }}
          ROUNDS: ${{ inputs.rounds }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          PROBLEM: ${{ inputs.problem }}
          LLM_EFFORT: ${{ inputs.effort }}
          LLM_PRICE_IN: ${{ inputs.price_in || vars.LLM_PRICE_IN }}
          LLM_PRICE_OUT: ${{ inputs.price_out || vars.LLM_PRICE_OUT }}
        working-directory: ${{ env.ROOT }}
        run: |
          set -o pipefail
          ARGS=(--problem "$PROBLEM" --workspace "$WS" --rounds "$ROUNDS" --provider "$PROVIDER")
          [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
          case "$TARGET" in
            model) MOD=llm.native_model_generator ;;
            model_optimize)
              MOD=llm.native_model_optimizer
              ARGS+=(--min-speedup "${OPT_MIN_SPEEDUP:-1.2}") ;;
            mip) MOD=llm.native_mip_generator ;;
            components)
              MOD=llm.native_generator
              ARGS+=(--slots $SLOTS --n "$N")
              [ -n "$HINT" ] && ARGS+=(--hint "$HINT") ;;
            optimize)
              MOD=llm.native_optimizer
              ARGS+=(--slots ${OPT_SLOTS:-neighborhood} --max-minutes 75 --min-speedup "${OPT_MIN_SPEEDUP:-1.2}")
              [ "$OPT_NEW_ONLY" = "true" ] && ARGS+=(--new-only) ;;
          esac
          echo "python -m $MOD ${ARGS[*]}"
          python -u -W ignore -m "$MOD" "${ARGS[@]}" 2>&1 | tee generate.log

      - name: Resumen de la corrida
        if: always()
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL_IN: ${{ inputs.model }}
          N: ${{ inputs.n }}
          ROUNDS: ${{ inputs.rounds }}
        working-directory: ${{ env.ROOT }}
        run: |
          MODEL="$MODEL_IN"; [ -z "$MODEL" ] && MODEL="(default de $PROVIDER)"
          {
            echo "## Generación con LLM (\`$TARGET\`)"
            echo ""
            echo "Proveedor \`$PROVIDER\` · modelo \`$MODEL\` · \`$N\` variantes por slot · hasta \`$ROUNDS\` rondas · \`$WS\`"
            echo ""
            case "$TARGET" in
              model) F="$WS/model_stats.json" ;; model_optimize) F="$WS/model_optimize_stats.json" ;;
              optimize) F="$WS/optimize_stats.json" ;; mip) F="$WS/mip_stats.json" ;; *) F="$WS/stats.json" ;;
            esac
            if [ -f "$F" ]; then echo '```json'; cat "$F"; echo '```'; fi
            echo ""
            if [ -f generate.log ]; then
              echo "<details><summary>Log completo de la generación</summary>"
              echo ""
              echo '```'
              cat generate.log
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "**No hay log**: el paso \`Generar y validar\` no llegó a ejecutarse"
              echo "(algún paso anterior falló y cortó la corrida)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reportes del validador en las correcciones
        if: always()
        working-directory: ${{ env.ROOT }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          tdir = pathlib.Path(os.environ["WS"]) / "transcript"
          calls = sorted(tdir.glob("*.json")) if tdir.exists() else []
          rej = []
          for p in calls:
              c = json.loads(p.read_text())
              if "RECHAZADO" in c.get("user", ""):
                  u = c["user"]; i = u.index("# Reporte del validador")
                  rej.append((p.name, u[i:i + 900]))
          if rej:
              print("\n### Rechazos y feedback devuelto al modelo\n")
              for name, body in rej:
                  print(f"<details><summary>{name}</summary>\n\n```\n{body}\n```\n\n</details>\n")
          else:
              print("\n_Ningún componente fue rechazado: no hubo prompts de corrección._\n")
          PY

      - name: Subir módulos y transcripciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ inputs.provider }}-${{ github.run_number }}
          path: |
            ${{ env.ROOT }}/generated/
            ${{ env.ROOT }}/generate.log
          if-no-files-found: warn
          retention-days: 30

      # La rama se empuja siempre (el artefacto expira y no siempre se puede descargar); el PR,
      # solo con open_pr.
      - name: Guardar en la rama llm-generated/… y abrir PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR: ${{ inputs.open_pr }}
          JOB_STATUS: ${{ job.status }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          SLOTS: ${{ inputs.slots }}
          N: ${{ inputs.n }}
          ROUNDS: ${{ inputs.rounds }}
          RUN: ${{ github.run_number }}
          BASE: ${{ github.ref_name }}
          PROBLEM: ${{ inputs.problem }}
        working-directory: ${{ env.ROOT }}
        run: |
          if [ -z "$(ls -A "$WS" 2>/dev/null)" ]; then
            echo "Nada que commitear."; exit 0
          fi
          BRANCH="llm-generated/$PROBLEM-$TARGET-$PROVIDER-run$RUN"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # las transcripciones incluyen los prompts completos: útiles, pero pesadas
          find "$WS" -name __pycache__ -type d -prune -exec rm -rf {} +
          git add -f "$WS"
          TAG=", $PROBLEM, $TARGET"
          git commit -m "Generado por $PROVIDER (corrida $RUN$TAG)" || { echo "Sin cambios."; exit 0; }
          git push -u origin "$BRANCH"
          echo "Resultados en la rama \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          # una corrida que falló se guarda para ver sus rechazos, pero no abre PR
          if [ "$OPEN_PR" != "true" ] || [ "$JOB_STATUS" != "success" ]; then exit 0; fi
          {
            echo "Corrida manual del workflow \`generar con LLM\` (\`$TARGET\` sobre \`$WS\`)."
            echo ""
            echo "- Proveedor: \`$PROVIDER\`, modelo: \`$MODEL\`"
            echo "- Slots: \`$SLOTS\`, \`$N\` variantes, hasta \`$ROUNDS\` rondas"
          } > pr-body.md
          gh pr create --title "Generado por LLM (corrida $RUN$TAG)" \
                       --body-file pr-body.md --base "$BASE" --head "$BRANCH"
