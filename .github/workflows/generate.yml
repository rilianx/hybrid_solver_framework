name: generar componentes con LLM

# Solo manual: cada corrida gasta llamadas de API, así que nunca se dispara
# por push ni por schedule.
on:
  workflow_dispatch:
    inputs:
      problem:
        description: "Problema"
        default: clsp
        type: choice
        options: [clsp, cvrp, jobshop]
      target:
        description: "Qué generar: componentes (slots), el ProblemModel completo (§6.1), optimize, native_components (componentes C++ sobre el modelo nativo; slots por defecto greedy_score neighborhood perturbation) o native_optimize (versiones más rápidas de los C++ aceptados; slots de opt_slots, por defecto neighborhood)"
        default: components
        type: choice
        options: [components, problem_model, optimize, native_components, native_optimize]
      model_mode:
        description: "Con target=problem_model: por piezas validadas con casos de prueba, o en un solo módulo"
        default: parts
        type: choice
        options: [parts, monolithic]
      slots:
        description: "Slots a generar (separados por espacio)"
        default: "neighborhood destruction constructor perturbation"
        type: string
      n:
        description: "Variantes por slot"
        default: "3"
        type: string
      rounds:
        description: "Rondas máximas (1 generación + correcciones)"
        default: "3"
        type: string
      provider:
        description: "Proveedor del LLM"
        default: openai
        type: choice
        options: [openai, anthropic]
      model:
        description: "Modelo (vacío = default del proveedor: gpt-5.4-mini en openai, claude-opus-5-5 en anthropic)"
        default: ""
        type: string
      effort:
        description: "Con provider=anthropic: profundidad del pensamiento (low | medium | high | xhigh | max; vacío = high)"
        default: ""
        type: string
      price_in:
        description: "USD por millón de tokens de ENTRADA (vacío = no estimar costo)"
        default: ""
        type: string
      price_out:
        description: "USD por millón de tokens de SALIDA"
        default: ""
        type: string
      fresh:
        description: "Borrar generated/ antes de correr"
        default: true
        type: boolean
      open_pr:
        description: "Abrir un PR con los módulos generados"
        default: true
        type: boolean
      from_scratch:
        description: "Desde cero: sin componentes de referencia (escribe en generated/<problema>_scratch)"
        default: false
        type: boolean
      planner:
        description: "Planificador de ideas + implementación en paralelo (escribe en <dir>_planner)"
        default: false
        type: boolean
      variant:
        description: "Ciclo completo (llm.cycle): representación (cvrp: routes | tour; clsp: setups; jobshop: sequences | operations). Con target=problem_model genera el modelo por piezas del ciclo; con target=components, los componentes desde cero sobre ese modelo"
        default: ""
        type: string
      reference:
        description: "Ciclo completo, target=components: usar las piezas de referencia de la variante en vez del modelo generado"
        default: false
        type: boolean
      construction_only:
        description: "Ciclo, target=problem_model: solo la vista constructiva, sobre el modelo ya aceptado del workspace"
        default: false
        type: boolean
      opt_slots:
        description: "Con target=optimize: slots cuyos componentes se aceleran (none = solo el modelo)"
        default: "neighborhood greedy_score"
        type: string
      workspace:
        description: "Directorio de salida (vacío = según from_scratch/planner); úsalo para no pisar una corrida anterior"
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WS: ${{ inputs.workspace || ((inputs.target == 'native_components' || inputs.target == 'native_optimize') && format('generated/{0}_native', inputs.problem)) || (inputs.variant != '' && format('generated/{0}_{1}_cycle{2}', inputs.problem, inputs.variant, inputs.reference && '_ref' || '')) || (inputs.target == 'problem_model' && format('generated/{0}_model{1}', inputs.problem, inputs.model_mode == 'parts' && '_parts' || '')) || format('generated/{0}{1}{2}', inputs.problem, inputs.from_scratch && '_scratch' || '', inputs.planner && '_planner' || '') }}
      TARGET: ${{ inputs.target }}
      MODEL_MODE: ${{ inputs.model_mode }}
      PKG: ${{ inputs.problem == 'cvrp' && 'cvrp' || inputs.problem == 'jobshop' && 'jobshop' || 'lotsizing' }}
      SCRATCH: ${{ inputs.from_scratch && 'true' || 'false' }}
      PLANNER: ${{ inputs.planner && 'true' || 'false' }}
      VARIANT: ${{ inputs.variant }}
      REFERENCE: ${{ inputs.reference && 'true' || 'false' }}
      CONSTRUCTION_ONLY: ${{ inputs.construction_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Localizar la raíz del framework
        run: |
          # el framework puede estar en la raíz del repo o en una subcarpeta
          HIT="$(find . -path ./.git -prune -o -path '*/core/skeleton.py' -print | head -1)"
          if [ -z "$HIT" ]; then echo "::error::No encontré core/skeleton.py en el repo."; exit 1; fi
          ROOT="$(dirname "$(dirname "$HIT")")"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Raíz del framework: $ROOT"

      - name: Instalar dependencias
        working-directory: ${{ env.ROOT }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar que la clave está configurada
        env:
          PROVIDER: ${{ inputs.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}
        working-directory: ${{ env.ROOT }}
        run: |
          if [ "$PROVIDER" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Falta el secreto OPENAI_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "$PROVIDER" = "anthropic" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Limpiar corrida anterior
        if: ${{ inputs.fresh }}
        working-directory: ${{ env.ROOT }}
        run: |
          # en el ciclo, la etapa de componentes conserva el modelo que generó la etapa anterior
          if [ "$TARGET" = "native_optimize" ]; then
            echo "native_optimize trabaja sobre los componentes C++ aceptados del workspace: no se limpia"
          elif [ -n "$VARIANT" ] && { [ "$TARGET" = "optimize" ] || [ "$CONSTRUCTION_ONLY" = "true" ]; }; then
            echo "optimize y --construction-only trabajan sobre el workspace existente: no se limpia"
          elif [ -n "$VARIANT" ] && [ "$TARGET" = "components" ] && [ -d "$WS" ]; then
            find "$WS" -mindepth 1 -maxdepth 1 ! -name model ! -name model_stats.json -exec rm -rf {} +
          else
            rm -rf "$WS"
          fi

      - name: Generar y validar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}
          SLOTS: ${{ inputs.slots }}
          OPT_SLOTS: ${{ inputs.opt_slots }}
          N: ${{ inputs.n }}
          ROUNDS: ${{ inputs.rounds }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          PROBLEM: ${{ inputs.problem }}
          LLM_EFFORT: ${{ inputs.effort }}
          LLM_PRICE_IN: ${{ inputs.price_in || vars.LLM_PRICE_IN }}
          LLM_PRICE_OUT: ${{ inputs.price_out || vars.LLM_PRICE_OUT }}
        working-directory: ${{ env.ROOT }}
        run: |
          set -o pipefail
          if [ -n "$VARIANT" ]; then
            STAGE=model; [ "$TARGET" = "components" ] && STAGE=components; [ "$TARGET" = "optimize" ] && STAGE=optimize
            CARGS="--problem $PROBLEM --variant $VARIANT --workspace $WS"
            # model y optimize llaman al LLM directo; components lo pasa a llm.cli en REST
            [ "$STAGE" != "components" ] && CARGS="$CARGS --provider $PROVIDER"
            [ "$REFERENCE" = "true" ] && CARGS="$CARGS --reference"
            if [ "$STAGE" = "optimize" ]; then
              [ -n "$MODEL" ] && CARGS="$CARGS --model $MODEL"
              OPT="${OPT_SLOTS:-neighborhood greedy_score}"; [ "$OPT" = "none" ] && OPT=""
              echo "python -m llm.cycle optimize $CARGS --rounds $ROUNDS --slots $OPT"
              python -u -W ignore -m llm.cycle optimize $CARGS --rounds "$ROUNDS" --slots $OPT 2>&1 | tee generate.log
            elif [ "$STAGE" = "model" ]; then
              [ -n "$MODEL" ] && CARGS="$CARGS --model $MODEL"
              [ "$CONSTRUCTION_ONLY" = "true" ] && CARGS="$CARGS --construction-only"
              echo "python -m llm.cycle model $CARGS --rounds $ROUNDS"
              python -W ignore -m llm.cycle model $CARGS --rounds "$ROUNDS" 2>&1 | tee generate.log
            else
              REST="--n $N --rounds $ROUNDS --provider $PROVIDER"
              [ -n "$MODEL" ] && REST="$REST --model $MODEL"
              echo "python -m llm.cycle components $CARGS -- $REST"
              python -W ignore -m llm.cycle components $CARGS -- $REST 2>&1 | tee generate.log
            fi
            exit 0
          fi
          if [ "$TARGET" = "native_optimize" ]; then
            OPT="${OPT_SLOTS:-neighborhood}"; [ "$OPT" = "none" ] && OPT="neighborhood"
            ARGS="--problem $PROBLEM --workspace $WS --slots $OPT --rounds $ROUNDS --provider $PROVIDER --max-minutes 35"
            if [ -n "$MODEL" ]; then ARGS="$ARGS --model $MODEL"; fi
            echo "python -m llm.native_optimizer $ARGS"
            python -u -W ignore -m llm.native_optimizer $ARGS 2>&1 | tee generate.log
            exit 0
          fi
          if [ "$TARGET" = "native_components" ]; then
            NSLOTS="$SLOTS"; [ "$NSLOTS" = "neighborhood destruction constructor perturbation" ] && NSLOTS="greedy_score neighborhood perturbation"
            ARGS="--problem $PROBLEM --workspace $WS --slots $NSLOTS --n $N --rounds $ROUNDS --provider $PROVIDER"
            if [ -n "$MODEL" ]; then ARGS="$ARGS --model $MODEL"; fi
            echo "python -m llm.native_generator $ARGS"
            python -u -W ignore -m llm.native_generator $ARGS 2>&1 | tee generate.log
            exit 0
          fi
          if [ "$TARGET" = "problem_model" ]; then
            ARGS="--rounds $ROUNDS --provider $PROVIDER --workspace $WS"
            if [ -n "$MODEL" ]; then ARGS="$ARGS --model $MODEL"; fi
            if [ "$MODEL_MODE" = "monolithic" ]; then ARGS="$ARGS --monolithic"; fi
            echo "python -m examples.$PKG.generate_model $ARGS"
            python -W ignore -m "examples.$PKG.generate_model" $ARGS 2>&1 | tee generate.log
            exit 0
          fi
          ARGS="--slots $SLOTS --n $N --rounds $ROUNDS --provider $PROVIDER --workspace $WS"
          if [ -n "$MODEL" ]; then ARGS="$ARGS --model $MODEL"; fi
          if [ "$SCRATCH" = "true" ]; then ARGS="$ARGS --from-scratch"; fi
          if [ "$PLANNER" = "true" ]; then ARGS="$ARGS --planner"; fi
          echo "python -m examples.$PKG.generate $ARGS"
          python -W ignore -m "examples.$PKG.generate" $ARGS 2>&1 | tee generate.log

      - name: Resumen de la corrida
        if: always()
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL_IN: ${{ inputs.model }}
          N: ${{ inputs.n }}
          ROUNDS: ${{ inputs.rounds }}
        working-directory: ${{ env.ROOT }}
        run: |
          MODEL="$MODEL_IN"; [ -z "$MODEL" ] && MODEL="(default de $PROVIDER)"
          {
            echo "## Generación de componentes"
            echo ""
            echo "Proveedor \`$PROVIDER\` · modelo \`$MODEL\` · \`$N\` variantes por slot · hasta \`$ROUNDS\` rondas"
            if [ "$SCRATCH" = "true" ]; then echo ""; echo "**Desde cero**: sin componentes de referencia, en \`$WS\`."; fi
            echo ""
            if [ -f "$WS/model_stats.json" ] && [ "$TARGET" = "problem_model" ]; then echo '```json'; cat "$WS/model_stats.json"; echo '```'; elif [ "$TARGET" = "problem_model" ]; then echo '```json'; cat "$WS/stats.json" 2>/dev/null; echo '```'; else python -m scripts.stats_summary "$WS/stats.json"; fi
            echo ""
            if [ -f generate.log ]; then
              echo "<details><summary>Log completo de la generación</summary>"
              echo ""
              echo '```'
              cat generate.log
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "**No hay log**: el paso \`Generar y validar\` no llegó a ejecutarse"
              echo "(algún paso anterior falló y cortó la corrida)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reportes del validador en las correcciones
        if: always()
        working-directory: ${{ env.ROOT }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          tdir = pathlib.Path(os.environ["WS"]) / "transcript"
          calls = sorted(tdir.glob("*.json")) if tdir.exists() else []
          rej = []
          for p in calls:
              c = json.loads(p.read_text())
              if "RECHAZADO" in c.get("user", ""):
                  u = c["user"]; i = u.index("# Reporte del validador")
                  rej.append((p.name, u[i:i + 900]))
          if rej:
              print("\n### Rechazos y feedback devuelto al modelo\n")
              for name, body in rej:
                  print(f"<details><summary>{name}</summary>\n\n```\n{body}\n```\n\n</details>\n")
          else:
              print("\n_Ningún componente fue rechazado: no hubo prompts de corrección._\n")
          PY

      - name: Subir módulos y transcripciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ inputs.provider }}-${{ github.run_number }}
          path: |
            ${{ env.ROOT }}/generated/
            ${{ env.ROOT }}/generate.log
          if-no-files-found: warn
          retention-days: 30

      # La rama se empuja siempre (el artefacto expira y no siempre se puede descargar); el PR,
      # solo con open_pr.
      - name: Guardar en la rama llm-generated/… y abrir PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR: ${{ inputs.open_pr }}
          JOB_STATUS: ${{ job.status }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          SLOTS: ${{ inputs.slots }}
          N: ${{ inputs.n }}
          ROUNDS: ${{ inputs.rounds }}
          RUN: ${{ github.run_number }}
          BASE: ${{ github.ref_name }}
          PROBLEM: ${{ inputs.problem }}
        working-directory: ${{ env.ROOT }}
        run: |
          if [ -z "$(ls -A "$WS" 2>/dev/null)" ]; then
            echo "Nada que commitear."; exit 0
          fi
          PFX="$PROVIDER"; [ "$PROBLEM" != "clsp" ] && PFX="$PROBLEM-$PROVIDER"
          BRANCH="llm-generated/$PFX-run$RUN"
          [ "$SCRATCH" = "true" ] && BRANCH="llm-generated/$PFX-scratch-run$RUN"
          [ "$PLANNER" = "true" ] && BRANCH="$BRANCH-planner"
          [ "$TARGET" = "problem_model" ] && BRANCH="llm-generated/$PROBLEM-$PROVIDER-model-run$RUN"
          [ "$TARGET" = "native_components" ] && BRANCH="llm-generated/$PROBLEM-native-$PROVIDER-run$RUN"
          [ "$TARGET" = "native_optimize" ] && BRANCH="llm-generated/$PROBLEM-native-optimize-$PROVIDER-run$RUN"
          [ -n "$VARIANT" ] && BRANCH="llm-generated/$PROBLEM-$VARIANT-cycle-$TARGET-run$RUN"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # las transcripciones incluyen los prompts completos: útiles, pero pesadas
          find "$WS" -name __pycache__ -type d -prune -exec rm -rf {} +
          git add -f "$WS"
          TAG=""; [ "$SCRATCH" = "true" ] && TAG=", desde cero"
          [ "$PLANNER" = "true" ] && TAG="$TAG, con planificador"
          [ "$PROBLEM" != "clsp" ] && TAG="$TAG, $PROBLEM"
          [ "$TARGET" = "problem_model" ] && TAG="$TAG, ProblemModel"
          [ "$TARGET" = "native_components" ] && TAG="$TAG, C++"
          [ "$TARGET" = "native_optimize" ] && TAG="$TAG, optimización C++"
          [ -n "$VARIANT" ] && TAG="$TAG, ciclo $VARIANT"
          git commit -m "Componentes generados por $PROVIDER (corrida $RUN$TAG)" || { echo "Sin cambios."; exit 0; }
          git push -u origin "$BRANCH"
          echo "Resultados en la rama \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          # una corrida que falló se guarda para ver sus rechazos, pero no abre PR
          if [ "$OPEN_PR" != "true" ] || [ "$JOB_STATUS" != "success" ]; then exit 0; fi
          {
            echo "Corrida manual del workflow \`generar componentes con LLM\`."
            echo ""
            echo "- Proveedor: \`$PROVIDER\`, modelo: \`$MODEL\`"
            echo "- Slots: \`$SLOTS\`, \`$N\` variantes, hasta \`$ROUNDS\` rondas"
            if [ "$SCRATCH" = "true" ]; then echo "- **Desde cero**: sin componentes de referencia, en \`$WS\`"; fi
            echo ""
            if [ -f "$WS/model_stats.json" ] && [ "$TARGET" = "problem_model" ]; then echo '```json'; cat "$WS/model_stats.json"; echo '```'; elif [ "$TARGET" = "problem_model" ]; then echo '```json'; cat "$WS/stats.json"; echo '```'; else python -m scripts.stats_summary "$WS/stats.json"; fi
            echo ""
            echo "Antes de mezclar: corre \`benchmark_components\` para ver si estos componentes"
            echo "además de válidos son útiles y distintos entre sí."
          } > pr-body.md
          gh pr create --title "Componentes generados por LLM (corrida $RUN$TAG)" \
                       --body-file pr-body.md --base "$BASE" --head "$BRANCH"
