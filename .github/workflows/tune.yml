name: tuning (Optuna) sobre el catálogo

# Manual: cada corrida son minutos de CPU. Responde la pregunta de §10: ¿el catálogo
# ampliado con componentes LLM ayuda o diluye? Afina con el catálogo a mano y con el
# ampliado, evalúa ambos ganadores en instancias de TEST y compara.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Trials de Optuna por catálogo (los 8 defaults van incluidos)"
        default: "40"
        type: string
      budget:
        description: "Segundos por corrida (tuning y test)"
        default: "5"
        type: string
      train:
        description: "Instancias de entrenamiento"
        default: "3"
        type: string
      test:
        description: "Instancias de test (no vistas)"
        default: "3"
        type: string
      catalog:
        description: "Catálogo"
        default: both
        type: choice
        options: [both, three, handwritten, generated, all]
      generated_dir:
        description: "Directorio de los componentes generados (p.ej. generated/clsp_scratch)"
        default: "generated/clsp"
        type: string
      skeletons:
        description: "Esqueletos (separados por espacio; vacío = todos). Ej.: SA ILS VNS"
        default: ""
        type: string
      size:
        description: "Tamaño de las instancias, ítems×períodos"
        default: "10x15"
        type: string
      ref_time:
        description: "Segundos del MIP completo por instancia de test como referencia del gap (0 = sin MIP)"
        default: "60"
        type: string
      generated_ref:
        description: "Rama/tag con generated/clsp (vacío = la rama actual)"
        default: ""
        type: string
      reeval_top:
        description: "Selección final: re-evaluar en train los k mejores trials y el mejor default (0 = no)"
        default: "0"
        type: string
      seed:
        description: "Semilla del tuner (las instancias no cambian con ella si se fija instance_seed)"
        default: "0"
        type: string

permissions:
  contents: write  # para commitear los resultados en la rama tuning/runN

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.generated_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Localizar la raíz del framework
        run: |
          HIT="$(find . -path ./.git -prune -o -path '*/core/skeleton.py' -print | head -1)"
          if [ -z "$HIT" ]; then echo "::error::No encontré core/skeleton.py en el repo."; exit 1; fi
          echo "ROOT=$(dirname "$(dirname "$HIT")")" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        working-directory: ${{ env.ROOT }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Afinar y evaluar en test
        working-directory: ${{ env.ROOT }}
        env:
          TRIALS: ${{ inputs.trials }}
          BUDGET: ${{ inputs.budget }}
          TRAIN: ${{ inputs.train }}
          TEST: ${{ inputs.test }}
          CATALOG: ${{ inputs.catalog }}
          SKELETONS: ${{ inputs.skeletons }}
          SIZE: ${{ inputs.size }}
          REF_TIME: ${{ inputs.ref_time }}
          GEN_DIR: ${{ inputs.generated_dir }}
          REEVAL: ${{ inputs.reeval_top }}
          SEED: ${{ inputs.seed }}
        run: |
          set -o pipefail
          ITEMS="${SIZE%%x*}"; PERIODS="${SIZE##*x}"
          SK_ARGS=()
          if [ -n "$SKELETONS" ]; then read -ra SK <<< "$SKELETONS"; SK_ARGS=(--skeletons "${SK[@]}"); fi
          python -W ignore -m examples.lotsizing.tune --trials "$TRIALS" --budget "$BUDGET" \
            --train "$TRAIN" --test "$TEST" --catalog "$CATALOG" --items "$ITEMS" --periods "$PERIODS" \
            --ref-time "$REF_TIME" --generated "$GEN_DIR" --reeval-top "$REEVAL" --tuner-seed "$SEED" \
            "${SK_ARGS[@]}" --out tuning_out --irace tuning_out/irace 2>&1 | tee tune.log

      - name: Resumen
        if: always()
        working-directory: ${{ env.ROOT }}
        run: |
          {
            echo "## Tuning con Optuna"
            echo ""
            python -m scripts.tuning_summary tuning_out
            echo ""
            echo "<details><summary>Log completo</summary>"
            echo ""
            echo '```'
            cat tune.log 2>/dev/null || echo "(sin log)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # El artefacto de abajo expira a los 30 días; la rama queda. Los resultados van a
      # results/tune_runN/ para que fusionarla a main los deje junto a los anteriores.
      - name: Guardar resultados en la rama tuning/run${{ github.run_number }}
        if: always()
        working-directory: ${{ env.ROOT }}
        env:
          RUN: ${{ github.run_number }}
        run: |
          if [ -z "$(ls -A tuning_out 2>/dev/null)" ]; then echo "Sin resultados que guardar."; exit 0; fi
          DEST="results/tune_run$RUN"
          mkdir -p "$DEST"
          cp -r tuning_out/. "$DEST/"
          cp tune.log "$DEST/" 2>/dev/null || true
          python -m scripts.tuning_summary tuning_out > "$DEST/README.md"
          BRANCH="tuning/run$RUN"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -f "$DEST"
          git commit -m "Resultados de tuning (corrida $RUN)" || { echo "Sin cambios."; exit 0; }
          git push -u origin "$BRANCH"
          echo "Resultados en la rama \`$BRANCH\`, carpeta \`$DEST\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuning-${{ github.run_number }}
          path: |
            ${{ env.ROOT }}/tuning_out/
            ${{ env.ROOT }}/tune.log
          if-no-files-found: warn
          retention-days: 30
