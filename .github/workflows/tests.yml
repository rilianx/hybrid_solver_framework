name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sin secretos: este workflow corre en PRs de forks sin exponer nada.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Localizar la raíz del framework
        run: |
          # el framework puede estar en la raíz del repo o en una subcarpeta
          HIT="$(find . -path ./.git -prune -o -path '*/core/skeleton.py' -print | head -1)"
          if [ -z "$HIT" ]; then echo "::error::No encontré core/skeleton.py en el repo."; exit 1; fi
          ROOT="$(dirname "$(dirname "$HIT")")"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Raíz del framework: $ROOT"

      - name: Instalar dependencias
        working-directory: ${{ env.ROOT }}
        run: |
          python -m pip install --upgrade pip
          pip install pulp pytest

      - name: Verificar que hay un solver MIP disponible
        working-directory: ${{ env.ROOT }}
        run: |
          python - <<'PY'
          import sys, pulp
          avail = pulp.listSolvers(onlyAvailable=True)
          print("pulp", pulp.__version__, "| solvers:", avail)
          if not avail:
              sys.exit("No hay ningún solver MIP disponible: los tests de las matheurísticas fallarían.")
          PY

      - name: pytest
        working-directory: ${{ env.ROOT }}
        run: python -m pytest -q -W ignore::DeprecationWarning --durations=10
